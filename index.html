<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171c20">
<title>War-game — Core Battle Prototype</title>
<style>
:root{color-scheme:dark;--bg:#14191d;--panel:#20282d;--panel2:#293238;--line:#414c52;--text:#f0eee5;--muted:#aab4b8;--gold:#d5b66d;--red:#b9514b;--blue:#527ca2;--green:#7eaa83}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer;border:1px solid #657078;background:#344148;color:var(--text);border-radius:8px;padding:10px 13px;min-height:42px}button:hover:not(:disabled){background:#46575f;border-color:var(--gold)}button:disabled{opacity:.38;cursor:not-allowed}.primary{background:#876e38;border-color:#b99b59;color:#fff8e5}.danger{background:#713c3a;border-color:#a45b55}.quiet{background:transparent}
header{display:flex;align-items:center;gap:12px;padding:10px clamp(14px,3vw,30px);border-bottom:1px solid var(--line);background:#1a2024}
h1{font-size:16px;letter-spacing:.04em;margin:0}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:10px;color:var(--gold);font-weight:750}
main{max-width:1280px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}.battle{min-width:0}.statusbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.phase{font-weight:750;font-size:17px}.hint{color:var(--muted);font-size:13px}
#field{width:100%;display:block;aspect-ratio:1.45;background:#555f4b;border:1px solid #78816d;border-radius:12px;touch-action:none;cursor:grab}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.controls button{flex:1 1 135px}
.side{display:flex;flex-direction:column;gap:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);margin:0 0 10px}
.unitrow{display:flex;gap:10px;align-items:center}.shield{width:36px;height:42px;border:2px solid #d6c9a1;border-radius:9px 9px 14px 14px;display:grid;place-items:center;font-weight:900;font-size:12px}.shield.player{background:#3d6586}.shield.ai{background:#8b3935}.unitname{font-weight:750}.unitmeta{font-size:12px;color:var(--muted)}.numbers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.stat{background:var(--panel2);padding:7px 4px;text-align:center;border-radius:7px}.stat b{display:block;font-size:16px}.stat span{font-size:10px;color:var(--muted);text-transform:uppercase}
#log{max-height:280px;overflow:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:#d6dcda}.logentry{padding-bottom:7px;border-bottom:1px solid #343e43}.logentry:last-child{border:0}.dice{color:var(--gold);font-weight:750}.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:3px 8px;color:var(--muted);font-size:11px}
footer{max-width:1280px;margin:0 auto;padding:0 18px 24px;color:var(--muted);font-size:12px}.unit-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.unit-stats .stat{min-width:0}.unit-stats .stat.save b{font-size:13px}.detail-line{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
@media(max-width:850px){main{grid-template-columns:1fr;padding:12px}.side{display:grid;grid-template-columns:1fr}.side .logpanel{grid-column:auto}#field{aspect-ratio:1.15}.statusbar{align-items:flex-start;flex-direction:column}header{padding:10px 14px}}
@media(max-width:500px){.unit-stats{grid-template-columns:repeat(5,minmax(0,1fr))}#field{aspect-ratio:.95}.hint{font-size:12px}}

.dice-stack{display:grid;gap:6px;margin-top:7px;padding:8px;background:#182024;border:1px solid #3b484e;border-radius:8px}
.dice-duel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dice-side{min-width:0;border:1px solid #455158;border-radius:7px;padding:7px}
.dice-side h3{font-size:11px;margin:0 0 5px;color:var(--text)}
.dice-lane{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin:4px 0}
.lane-label{width:100%;font-size:10px;color:var(--muted)}
.die{width:25px;height:25px;display:inline-grid;place-items:center;border:1px solid #6e7b80;border-radius:5px;background:#354148;color:#fff;font-size:12px;font-weight:800}
.die.success{background:#245d43;border-color:#65bb89;color:#e4ffed}
.die.fail{background:#783d3a;border-color:#c76c64;color:#ffe7e4}
.die.save{background:#285274;border-color:#75b5e0;color:#e9f7ff}.die.fail.save{background:#783d3a;border-color:#c76c64;color:#ffe7e4}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.unit-card{display:flex;align-items:center;gap:8px;text-align:left;padding:8px;border:1px solid var(--line);border-radius:8px;background:#1b2226;min-width:0}
.unit-card.unmoved{border:2px solid #d5b66d;box-shadow:inset 0 0 0 1px rgba(213,182,109,.2)}
.unit-card.selected{background:#334149;border-color:#f4dda1}
.unit-card .unitmeta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit-card .shield{flex:0 0 30px;width:30px;height:34px}
.unit-card .unitname{font-size:12px}
.unit-card .unitmeta{font-size:10px}
.phase-note{font-size:12px;color:var(--muted);margin-top:7px}
@media(max-width:500px){.dice-duel{grid-template-columns:1fr}.roster{grid-template-columns:1fr 1fr}.unit-card{padding:6px;gap:5px}}
\n</style>
</head>
<body>

<main>
<section class="battle">
 <div class="statusbar"><div><div class="eyebrow" id="turnlabel">TURN 1</div><div class="phase" id="phaselabel">Movement — Charge declarations</div></div><div class="hint" id="instruction">Select your regiment, then declare a charge or move.</div></div>
 <canvas id="field" aria-label="Battlefield showing two regiment banners"></canvas>
 <div class="controls" id="controls"></div>
</section>
<aside class="side">
 <section class="panel"><h2>Units</h2><div class="roster" id="roster"></div><div class="phase-note">Gold border = not yet moved this phase.</div></section>\n <section class="panel" id="unitdetails">
  <h2>Selected unit</h2>
  <div class="unitrow"><div class="shield player" id="unitshield">✦</div><div><div class="unitname" id="detailname">Empire Swordsmen</div><div class="unitmeta" id="detailmeta">20 models · Hand weapon</div></div></div>
  <div class="unit-stats" id="unitstats"></div>
  <div class="detail-line unitmeta" id="unitformation"></div>
  <div class="detail-line unitmeta" id="unitrules"></div>
 </section>
 <section class="panel logpanel"><h2>Battle log</h2><div id="log" aria-live="polite"></div></section>
</aside>
</main>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const canvas = $("field"), ctx = canvas.getContext("2d");
const BATTLEFIELD_WIDTH_IN=48, MODEL_BASE_IN=.9, BOW_RANGE=24;
const S={
 turn:1,phase:"charges",selected:"pSword",finished:false,combatRound:0,loser:null,crDiff:0,log:[],
 units:{
  pSword:{id:"pSword",name:"Empire Swordsmen",short:"Swordsmen",side:"player",kind:"melee",models:20,startModels:20,x:.22,y:.36,facing:0,engaged:false,activated:false,moved:false,shot:false,charged:false,fled:false,moveUsed:0,damage:0,shootCasualties:0,panicTested:false,stats:{M:4,WS:3,BS:3,S:3,T:3,W:1,I:3,A:1,Ld:7,save:"-"}},
  pArch:{id:"pArch",name:"Empire Archers",short:"Archers",side:"player",kind:"archer",models:10,startModels:10,x:.22,y:.70,facing:0,engaged:false,activated:false,moved:false,shot:false,charged:false,fled:false,moveUsed:0,damage:0,shootCasualties:0,panicTested:false,stats:{M:4,WS:3,BS:3,S:3,T:3,W:1,I:3,A:1,Ld:7,save:"-"}},
  aSword:{id:"aSword",name:"Opposing Swordsmen",short:"Swordsmen",side:"ai",kind:"melee",models:20,startModels:20,x:.78,y:.36,facing:Math.PI,engaged:false,activated:false,moved:false,shot:false,charged:false,fled:false,moveUsed:0,damage:0,shootCasualties:0,panicTested:false,stats:{M:4,WS:3,BS:3,S:3,T:3,W:1,I:3,A:1,Ld:7,save:"-"}},
  aArch:{id:"aArch",name:"Opposing Archers",short:"Archers",side:"ai",kind:"archer",models:10,startModels:10,x:.78,y:.70,facing:Math.PI,engaged:false,activated:false,moved:false,shot:false,charged:false,fled:false,moveUsed:0,damage:0,shootCasualties:0,panicTested:false,stats:{M:4,WS:3,BS:3,S:3,T:3,W:1,I:3,A:1,Ld:7,save:"-"}}
 }
};
const units=()=>Object.values(S.units), alive=u=>u.models>0;
const W=()=>canvas.clientWidth,H=()=>canvas.clientHeight,PX_PER_IN=()=>W()/BATTLEFIELD_WIDTH_IN,fieldHeightIn=()=>H()/Math.max(1,PX_PER_IN());
const dist=(a,b)=>Math.hypot((a.x-b.x)*BATTLEFIELD_WIDTH_IN,(a.y-b.y)*fieldHeightIn());
const enemies=u=>units().filter(v=>v.side!==u.side&&alive(v));
function say(msg){S.log.unshift(msg);S.log=S.log.slice(0,45);$("log").innerHTML=S.log.map(x=>'<div class="logentry">'+x+'</div>').join("");}
function roll(n){return Array.from({length:n},()=>1+Math.floor(Math.random()*6));}
function dieHtml(n,pass,kind){return '<span class="die '+(pass?'success':'fail')+(kind==='save'?' save':'')+'" title="'+(pass?'success':'failure')+'">'+n+'</span>';}
function lane(label,values,threshold,mode){return '<div class="dice-lane"><span class="lane-label">'+label+'</span>'+values.map(v=>dieHtml(v,mode==='save'?v>=threshold:v>=threshold,mode)).join("")+'</div>';}
function diceStack(u,r){
 let out='<div class="dice-stack"><b>'+u.name+'</b>';
 out+=lane('To hit — need '+(r.hitNeed>6?'7+ (impossible)':r.hitNeed+'+'),r.hitRolls,r.hitNeed,'hit');
 out+=lane('To wound — '+r.hits+' hits; need '+r.woundNeed+'+',r.woundRolls,r.woundNeed,'wound');
 if(r.saveNeed!==null)out+=lane('Armour saves — '+r.woundsBeforeSave+' wounds; need '+(r.saveNeed>6?'7+ (impossible)':r.saveNeed+'+'),r.saveRolls,r.saveNeed,'save');
 out+='<div class="unitmeta">Result: '+r.hits+' hits, '+r.woundsBeforeSave+' wounds, '+r.saved+' saved, <b>'+r.wounds+' unsaved</b>.</div></div>';return out;
}
function diceDuel(title,r1,r2){return '<div><b>'+title+'</b><div class="dice-duel">'+(r1?'<div class="dice-side"><h3>Player</h3>'+diceStack(S.units.pSword.side==='player'?S.units.pSword:S.units.pArch,r1)+'</div>':'')+(r2?'<div class="dice-side"><h3>Opponent</h3>'+diceStack(S.units.aSword.side==='ai'?S.units.aSword:S.units.aArch,r2)+'</div>':'')+'</div></div>';}
function setupCanvas(){const r=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
function shape(u){const files=5,ranks=Math.max(1,Math.ceil(u.models/files)),base=MODEL_BASE_IN*PX_PER_IN();return {files,ranks,base,front:files*base,depth:ranks*base};}
function corners(u,x=u.x,y=u.y,f=u.facing){const q=shape(u),fx=Math.cos(f),fy=Math.sin(f),lx=-fy,ly=fx,cx=x*W(),cy=y*H(),front=q.front/2,depth=q.depth/2;return [{x:cx-fx*depth-lx*front,y:cy-fy*depth-ly*front},{x:cx+fx*depth-lx*front,y:cy+fy*depth-ly*front},{x:cx+fx*depth+lx*front,y:cy+fy*depth+ly*front},{x:cx-fx*depth+lx*front,y:cy-fy*depth+ly*front}];}
function overlap(a,b){for(const poly of [a,b])for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length],ax=-(q.y-p.y),ay=q.x-p.x,A=a.map(v=>v.x*ax+v.y*ay),B=b.map(v=>v.x*ax+v.y*ay);if(Math.max(...A)<Math.min(...B)+.01||Math.max(...B)<Math.min(...A)+.01)return false;}return true;}
function canPlace(u,x,y,f){const poly=corners(u,x,y,f),w=W(),h=H();if(poly.some(p=>p.x<1||p.y<1||p.x>w-1||p.y>h-1))return false;return !units().some(v=>v!==u&&alive(v)&&overlap(poly,corners(v)));}
function drawCone(u){if(u.side!=="player"||u.engaged||u.fled||u.charged||!alive(u)||S.phase==="combat"||S.phase==="over")return;const q=shape(u),x=u.x*W(),y=u.y*H(),f=u.facing,range=u.stats.M*2*PX_PER_IN(),half=Math.PI/4,front=q.depth/2,fy=-Math.sin(f),fx=Math.cos(f),left=-Math.sin(f),ly=Math.cos(f);const sx=x+fx*front,sy=y+fy*front;ctx.save();ctx.fillStyle="rgba(229,195,105,.13)";ctx.strokeStyle="rgba(250,220,140,.7)";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(sx+left*q.front/2,sy+ly*q.front/2);ctx.lineTo(sx+left*q.front/2+Math.cos(f-half)*range,sy+ly*q.front/2+Math.sin(f-half)*range);ctx.arc(sx,sy,range,f-half,f+half);ctx.lineTo(sx+left*q.front/2,sy+ly*q.front/2);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
function drawUnit(u){if(!alive(u))return;const w=W(),h=H(),x=u.x*w,y=u.y*h,q=shape(u),selected=S.selected===u.id,base=q.base;ctx.save();ctx.translate(x,y);ctx.rotate(u.facing);
 ctx.fillStyle="rgba(0,0,0,.24)";ctx.fillRect(-q.depth/2+3,-q.front/2+4,q.depth,q.front);
 ctx.fillStyle=u.side==="player"?(u.kind==="archer"?"#4b8065":"#365e7e"):(u.kind==="archer"?"#a17b42":"#813c36");ctx.fillRect(-q.depth/2,-q.front/2,q.depth,q.front);
 let left=u.models;for(let rank=0;rank<q.ranks;rank++){const count=Math.min(q.files,left);for(let file=0;file<count;file++){const cx=q.depth/2-(rank+.5)*base,cy=-q.front/2+(file+.5)*base;ctx.fillStyle=u.side==="player"?(u.kind==="archer"?"#71aa84":"#456f91"):(u.kind==="archer"?"#c4a05f":"#a44a42");ctx.fillRect(cx-base/2+.7,cy-base/2+.7,base-1.4,base-1.4);ctx.strokeStyle="rgba(255,255,255,.8)";ctx.lineWidth=.9;ctx.strokeRect(cx-base/2+.7,cy-base/2+.7,base-1.4,base-1.4);}left-=count;}
 ctx.strokeStyle=selected?"#f7d98b":"#e3d6b5";ctx.lineWidth=selected?3:1.2;ctx.strokeRect(-q.depth/2,-q.front/2,q.depth,q.front);
 ctx.fillStyle="#f6e1a0";ctx.strokeStyle="#2a2a25";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(q.depth/2+9,0);ctx.lineTo(q.depth/2-1,-7);ctx.lineTo(q.depth/2-1,7);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
 ctx.fillStyle="#fff8e9";ctx.font="bold 11px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(u.short,x,y-q.front/2-11);ctx.font="bold 14px system-ui";ctx.fillText(String(u.models),x,y+q.front/2+14);if(u.engaged){ctx.fillStyle="#f2d67d";ctx.font="bold 10px system-ui";ctx.fillText("IN MELEE",x,y+q.front/2+27)}if(u.fled){ctx.fillStyle="#ffb3ad";ctx.font="bold 10px system-ui";ctx.fillText("FLEEING",x,y+q.front/2+27);}
}
function draw(){const w=W(),h=H();if(!w||!h)return;ctx.clearRect(0,0,w,h);ctx.fillStyle="#59654d";ctx.fillRect(0,0,w,h);ctx.strokeStyle="rgba(235,231,190,.12)";ctx.lineWidth=1;for(let x=0;x<w;x+=w/12){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=h/8){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.strokeStyle="rgba(240,230,185,.32)";ctx.setLineDash([5,7]);ctx.beginPath();ctx.moveTo(w/2,12);ctx.lineTo(w/2,h-12);ctx.stroke();ctx.setLineDash([]);
 const selected=S.units[S.selected];if(selected)drawCone(selected);units().forEach(drawUnit);}
function rankBonus(u){return Math.min(3,Math.max(0,Math.floor(u.models/5)-1));}
function hitTarget(attacker,defender){const a=attacker.stats.WS,d=defender.stats.WS;if(a>=d*2)return 3;if(a>d)return 3;if(a===d)return 4;if(a*2<=d)return 5;return 4;}
function woundTarget(s,t){if(s>=t*2)return 2;if(s>t)return 3;if(s===t)return 4;if(s*2<=t)return 6;return 5;}
function saveTarget(defender,strength){const raw=defender.stats.save;if(raw==="-"||raw==null)return null;const t=parseInt(raw,10);return Number.isFinite(t)?t+Math.max(0,strength-3):null;}
function applyDamage(u,wounds,shooting){const before=u.models,total=(u.damage||0)+wounds,killed=Math.floor(total/u.stats.W);u.models=Math.max(0,u.models-killed);u.damage=u.models?total%u.stats.W:0;if(shooting)u.shootCasualties+=before-u.models;return before-u.models;}
function meleeAttack(u,target){const attacks=Math.min(5,u.models)*u.stats.A,hitNeed=hitTarget(u,target),woundNeed=woundTarget(u.stats.S,target.stats.T),saveNeed=saveTarget(target,u.stats.S),hitRolls=roll(attacks),hits=hitRolls.filter(x=>x>=hitNeed).length,woundRolls=roll(hits),woundsBeforeSave=woundRolls.filter(x=>x>=woundNeed).length,saveRolls=saveNeed===null?[]:roll(woundsBeforeSave),saved=saveNeed===null?0:saveRolls.filter(x=>x>=saveNeed).length;return {attacks,hitNeed,hitRolls,hits,woundNeed,woundRolls,woundsBeforeSave,saveNeed,saveRolls,saved,wounds:Math.max(0,woundsBeforeSave-saved)};}
function bsTarget(u,target,longRange,moved,standShoot){let need=u.stats.BS>=5?2:u.stats.BS===4?3:u.stats.BS===3?4:u.stats.BS===2?5:6;if(longRange)need++;if(moved)need++;if(standShoot)need++;return Math.min(7,need);}
function shootAttack(u,target,standShoot){const d=dist(u,target),longRange=d>BOW_RANGE/2,hitNeed=bsTarget(u,target,longRange,u.moved,standShoot),shots=Math.min(10,u.models),hitRolls=roll(shots),hits=hitRolls.filter(x=>x>=hitNeed).length,woundNeed=woundTarget(u.stats.S,target.stats.T),woundRolls=roll(hits),woundsBeforeSave=woundRolls.filter(x=>x>=woundNeed).length,saveNeed=saveTarget(target,u.stats.S),saveRolls=saveNeed===null?[]:roll(woundsBeforeSave),saved=saveNeed===null?0:saveRolls.filter(x=>x>=saveNeed).length;return {attacks:shots,hitNeed,hitRolls,hits,woundNeed,woundRolls,woundsBeforeSave,saveNeed,saveRolls,saved,wounds:Math.max(0,woundsBeforeSave-saved),longRange,moved:u.moved,standShoot,distance:d};}
function showAttack(label,u,target,r,kind){const stack=diceStack(u,r);say('<b>'+label+': '+u.name+' → '+target.name+'</b><div class="unitmeta">'+r.attacks+' '+(kind==="shoot"?"bow shots":"attacks")+' · '+r.distance?.toFixed(1)+' inches'+(kind==="shoot"?' · '+(r.longRange?'long range, ':'')+(r.moved?'moved, ':'')+(r.standShoot?'stand and shoot':''):'')+'</div>'+stack); }
function panicTest(target){if(target.panicTested)return;const threshold=Math.ceil(target.startModels*.25);if(target.shootCasualties<threshold||!alive(target))return;target.panicTested=true;const dice=roll(2),total=dice[0]+dice[1];say('<b>Panic test — '+target.name+'</b>: shooting casualties '+target.shootCasualties+'/'+target.startModels+' (25% threshold '+threshold+'). 2D6 <span class="dice">'+dice.join(' + ')+' = '+total+'</span>; need '+target.stats.Ld+' or less.');if(total>target.stats.Ld){target.fled=true;target.engaged=false;say(target.name+' fails its unmodified Leadership test and flees.');}}
function shoot(u,target,standShoot){if(!alive(u)||!alive(target)||u.kind!=="archer"||u.shot||u.engaged)return false;const d=dist(u,target);if(d>BOW_RANGE)return false;if(standShoot&&d<=4)return false;const r=shootAttack(u,target,standShoot);u.shot=true;showAttack(standShoot?"Stand and shoot":"Shooting",u,target,r,"shoot");const killed=applyDamage(target,r.wounds,true);say(target.name+' loses '+killed+' model'+(killed===1?'':'s')+' to shooting.');if(!standShoot)panicTest(target);return true;}
function closestEnemy(u){return enemies(u).sort((a,b)=>dist(u,a)-dist(u,b))[0]||null;}
function selectedTarget(u){const list=enemies(u);return list.find(v=>v.id===S.targetId)||closestEnemy(u);}
function addTargetPicker(u){const list=enemies(u);if(!list.length)return null;const sel=document.createElement("select");sel.setAttribute("aria-label","Target unit");sel.style.flex="1 1 100%";sel.style.minHeight="42px";sel.style.background="#20282d";sel.style.color="var(--text)";sel.style.border="1px solid var(--line)";sel.style.borderRadius="8px";sel.style.padding="8px";list.forEach(v=>{const o=document.createElement("option");o.value=v.id;o.textContent="Target: "+v.name+" ("+v.models+")";sel.append(o);});const target=selectedTarget(u);if(target)sel.value=target.id;sel.onchange=()=>{S.targetId=sel.value;render();};$("controls").append(sel);return selectedTarget(u);}
function renderRoster(){const el=$("roster");el.innerHTML="";units().forEach(u=>{const b=document.createElement("button");b.className="unit-card"+(u.id===S.selected?" selected":"")+(u.side==="player"&&!u.moved&&!u.fled?" unmoved":"");b.innerHTML='<span class="shield '+(u.side==="player"?"player":"ai")+'">'+(u.kind==="archer"?"➶":"✦")+'</span><span style="min-width:0"><span class="unitname" style="display:block">'+u.name+'</span><span class="unitmeta">'+u.models+' models · '+(u.moved?"moved":u.shot?"fired":"not moved")+'</span></span>';b.onclick=()=>{S.selected=u.id;render();};el.append(b);});}
function render(){const names={charges:"Movement — Charge declarations",movement:"Movement & shooting",combat:"Melee — Attacks & combat resolution",break:"Combat resolution — Break test",over:"Battle complete"};$("turnlabel").textContent="TURN "+S.turn;$("phaselabel").textContent=names[S.phase]||S.phase;$("instruction").textContent=hint();const u=S.units[S.selected]||S.units.pSword,st=u.stats;$("unitshield").className="shield "+(u.side==="player"?"player":"ai");$("detailname").textContent=u.name;$("detailmeta").textContent=u.models+" models · "+(u.kind==="archer"?"Bow (24-inch range)":u.engaged?"In melee":u.fled?"Fleeing":"Hand weapon");$("unitstats").innerHTML=[["M",st.M],["WS",st.WS],["BS",st.BS],["S",st.S],["T",st.T],["W",st.W],["I",st.I],["A",st.A],["Ld",st.Ld],["AS",st.save]].map(([l,v])=>'<div class="stat '+(l==="AS"?"save":"")+'"><b>'+v+'</b><span>'+l+'</span></div>').join("");const q=shape(u);$("unitformation").textContent="Formation: "+Math.min(5,u.models)+" files × "+q.ranks+" ranks · "+u.models+" models · rank bonus +"+rankBonus(u);$("unitrules").textContent=u.kind==="archer"?"Bows: 24-inch range, front two ranks fire (up to 10 shots). −1 to hit over 12 inches and −1 after moving. Firing prevents further movement this phase.": "Melee: only the front rank fights. Complete ranks behind it add +1 combat resolution each, up to +3 (5 models wide). WS sets hit target; S vs T sets wound target.";renderRoster();draw();controls();}
function hint(){if(S.finished)return "Battle ended. Start a fresh battle to play again.";if(S.phase==="charges")return "Select a unit and declare a charge if an enemy is within double Move. Archers may stand and shoot if the charger is more than 4 inches away.";if(S.phase==="movement")return "Drag a player unit forward to move, then select an enemy and shoot with archers. Shooting locks that unit in place.";if(S.phase==="combat")return "Resolve all melee engagements. Equal Initiative units roll simultaneously.";if(S.phase==="break")return "Resolve the losing unit’s 2D6 Leadership test.";return "";}
function btn(label,fn,cls,disabled){const b=document.createElement("button");b.textContent=label;b.className=cls||"";b.disabled=!!disabled;b.onclick=fn;$("controls").append(b);}
function controls(){const el=$("controls");el.replaceChildren();if(S.finished){btn("New battle",reset,"primary");return;}const u=S.units[S.selected];
 if(S.phase==="charges"){const target=addTargetPicker(u)||selectedTarget(u);btn("Declare charge",()=>declareCharge(u,target),"primary",!u||u.side!=="player"||u.engaged||u.fled||u.charged||!target||dist(u,target)>u.stats.M*2);btn("Pass charges",()=>{say("You pass on further charge declarations.");setPhase("movement");});return;}
 if(S.phase==="movement"){const target=addTargetPicker(u)||selectedTarget(u);btn("Shoot selected archers",()=>{const t=selectedTarget(u);if(!t||!shoot(u,t,false))say("No legal shot: select living archers with an enemy within 24 inches.");S.selected=u.id;render();},"primary",!u||u.side!=="player"||u.kind!=="archer"||u.shot||u.engaged||!target||dist(u,target)>BOW_RANGE);btn("Finish movement & shooting",finishMovement,"");const meter=document.createElement("span");meter.className="pill";meter.textContent=u.name+": "+Math.max(0,u.stats.M-u.moveUsed).toFixed(1)+" in movement left";el.append(meter);return;}
 if(S.phase==="combat"){btn("Resolve melee combat",resolveCombat,"primary",!units().some(v=>v.side==="player"&&v.engaged&&alive(v)));btn("Skip combat (no melee)",endTurn,"",!units().some(v=>v.engaged&&alive(v)));return;}
 if(S.phase==="break")btn("Roll break test",resolveBreak,"primary");}
function setPhase(p){S.phase=p;units().forEach(u=>{u.activated=false;u.moved=false;u.shot=false;u.moveUsed=0;u.shootCasualties=0;u.panicTested=false;});render();}
function declareCharge(u,target){if(!u||!target||u.side!=="player"||u.engaged||u.fled||dist(u,target)>u.stats.M*2)return;const gap=dist(u,target);if(target.kind==="archer"&&gap>4&&gap<=BOW_RANGE){say(target.name+' chooses Stand and Shoot.');shoot(target,u,true);if(!alive(u)){render();return;}}if(gap<=u.stats.M*2&&alive(u)&&alive(target)){const q=shape(u),t=shape(target),dir=target.x>=u.x?1:-1;u.x=target.x-dir*(q.depth+t.depth)/2/BATTLEFIELD_WIDTH_IN;u.y=target.y;u.engaged=true;target.engaged=true;u.charged=true;say(u.name+' charges '+target.name+' and makes contact.');}else say(u.name+' charge fails.');setPhase("movement");}
function finishMovement(){units().filter(u=>u.side==="ai"&&u.kind==="archer"&&!u.shot&&!u.engaged&&alive(u)).forEach(u=>{const t=closestEnemy(u);if(t&&dist(u,t)<=BOW_RANGE)shoot(u,t,false);});units().forEach(u=>{if(u.side==="player"&&!u.moved)u.activated=true;});if(units().some(u=>u.engaged&&alive(u)))setPhase("combat");else{S.turn++;setPhase("charges");say("Turn "+S.turn+" begins.");}}
function resolveCombat(){const pairs=[];units().filter(u=>u.engaged&&alive(u)).forEach(u=>{const target=units().find(v=>v.engaged&&v.side!==u.side&&alive(v)&&dist(u,v)<4);if(target&&!pairs.some(p=>p.includes(u)||p.includes(target)))pairs.push([u,target]);});if(!pairs.length){say("No units are in melee.");endTurn();return;}S.combatRound++;let tests=[];
 pairs.forEach(pair=>{let p=pair[0],a=pair[1];if(p.side==="ai"){const tmp=p;p=a;a=tmp;}const pFirst=(p.charged&&!a.charged)||(!p.charged&&!a.charged&&p.stats.I>a.stats.I),aFirst=(a.charged&&!p.charged)||(!p.charged&&!a.charged&&a.stats.I>p.stats.I);let pr=null,ar=null;if(pFirst){pr=meleeAttack(p,a);applyDamage(a,pr.wounds,false);if(alive(a)){ar=meleeAttack(a,p);applyDamage(p,ar.wounds,false);}}else if(aFirst){ar=meleeAttack(a,p);applyDamage(p,ar.wounds,false);if(alive(p)){pr=meleeAttack(p,a);applyDamage(a,pr.wounds,false);}}else{pr=meleeAttack(p,a);ar=meleeAttack(a,p);applyDamage(a,pr.wounds,false);applyDamage(p,ar.wounds,false);}
 if(!pFirst&&!aFirst&&pr&&ar)say('<b>Simultaneous melee dice</b><div class="dice-duel"><div class="dice-side"><h3>'+p.name+' attacks '+a.name+'</h3>'+diceStack(p,pr)+'</div><div class="dice-side"><h3>'+a.name+' attacks '+p.name+'</h3>'+diceStack(a,ar)+'</div></div>');else{if(pr)say('<b>Melee dice — '+p.name+' attacks '+a.name+'</b>'+diceStack(p,pr));if(ar)say('<b>Melee dice — '+a.name+' attacks '+p.name+'</b>'+diceStack(a,ar));}if(!alive(p)||!alive(a))return;const crP=pr?pr.wounds:0,crA=ar?ar.wounds:0,scoreP=crP+rankBonus(p),scoreA=crA+rankBonus(a),diff=scoreP-scoreA;say('Combat resolution: '+p.name+' '+scoreP+' (unsaved wounds '+crP+' + rank bonus '+rankBonus(p)+') vs '+a.name+' '+scoreA+' (unsaved wounds '+crA+' + rank bonus '+rankBonus(a)+').');if(diff!==0)tests.push({loser:diff>0?a:p,diff:Math.abs(diff)});});
 if(units().filter(alive).filter(u=>u.side==="player").length===0){finishBattle("Opponent wins the battle!");return;}if(units().filter(alive).filter(u=>u.side==="ai").length===0){finishBattle("Player wins the battle!");return;}if(tests.length){S.loser=tests.sort((a,b)=>b.diff-a.diff)[0].loser;S.crDiff=tests[0].diff;S.phase="break";render();}else{say("Combat drawn; engaged units hold.");endTurn();}}
function resolveBreak(){const u=S.loser;if(!u||!alive(u)){endTurn();return;}const dice=roll(2),total=dice[0]+dice[1],needed=Math.max(2,u.stats.Ld-S.crDiff);say('<b>Break test — '+u.name+'</b>: 2D6 <span class="dice">'+dice.join(' + ')+' = '+total+'</span>; need '+needed+' or less (Leadership '+u.stats.Ld+' − combat result '+S.crDiff+').');if(total>needed){u.fled=true;u.engaged=false;say(u.name+' fails its break test and flees.');}else say(u.name+' holds.');if(units().filter(alive).every(v=>v.fled)||units().filter(v=>v.side==="player"&&alive(v)).length===0||units().filter(v=>v.side==="ai"&&alive(v)).length===0){finishBattle(units().some(v=>v.side==="player"&&alive(v)&&!v.fled)?"Player wins the battle!":"Opponent wins the battle!");}else endTurn();}
function endTurn(){units().forEach(u=>{u.charged=false;u.engaged=alive(u)&&u.engaged;});S.turn++;setPhase("charges");}
function finishBattle(msg){S.finished=true;S.phase="over";say('<b>'+msg+'</b>');render();}
function reset(){S.turn=1;S.phase="charges";S.selected="pSword";S.finished=false;S.combatRound=0;S.loser=null;S.crDiff=0;S.log=[];units().forEach(u=>Object.assign(u,{models:u.startModels,damage:0,x:u.id==="pSword"||u.id==="pArch"?.22:.78,y:u.id==="pSword"||u.id==="aSword"?.36:.70,facing:u.side==="player"?0:Math.PI,engaged:false,activated:false,moved:false,shot:false,charged:false,fled:false,moveUsed:0,shootCasualties:0,panicTested:false}));$("log").replaceChildren();say("Battle deployed: 20 swordsmen and 10 archers on each side.");render();}
let drag=null;
function pointerPoint(e){const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
canvas.addEventListener("pointerdown",e=>{if(S.finished)return;const pt=pointerPoint(e),ranked=units().filter(alive).map(u=>({u,d:Math.hypot(pt.x-u.x*W(),pt.y-u.y*H())})).sort((a,b)=>a.d-b.d);if(!ranked.length)return;const chosen=ranked[0].u;S.selected=chosen.id;if(S.phase==="movement"&&chosen.side==="player"&&!chosen.engaged&&!chosen.fled&&!chosen.shot&&chosen.moveUsed<chosen.stats.M){drag={u:chosen,start:pt,origin:{x:chosen.x,y:chosen.y,facing:chosen.facing,used:chosen.moveUsed},changed:false};canvas.setPointerCapture(e.pointerId);canvas.style.cursor="grabbing";e.preventDefault();}else render();});
canvas.addEventListener("pointermove",e=>{if(!drag)return;const u=drag.u,pt=pointerPoint(e),scale=PX_PER_IN(),remaining=Math.max(0,u.stats.M-drag.origin.used),dx=(pt.x-drag.start.x)/scale,dy=(pt.y-drag.start.y)/scale,along=dx*Math.cos(drag.origin.facing)+dy*Math.sin(drag.origin.facing),advance=Math.max(0,Math.min(remaining,along)),steps=Math.max(1,Math.ceil(advance/.1));let best=0;for(let i=1;i<=steps;i++){const n=advance*i/steps,x=drag.origin.x+Math.cos(drag.origin.facing)*n/BATTLEFIELD_WIDTH_IN,y=drag.origin.y+Math.sin(drag.origin.facing)*n/BATTLEFIELD_WIDTH_IN;if(!canPlace(u,x,y,drag.origin.facing))break;best=n;}u.x=drag.origin.x+Math.cos(drag.origin.facing)*best/BATTLEFIELD_WIDTH_IN;u.y=drag.origin.y+Math.sin(drag.origin.facing)*best/BATTLEFIELD_WIDTH_IN;u.facing=drag.origin.facing;u.moveUsed=drag.origin.used+best;u.moved=u.moved||best>0;drag.changed=best>0;draw();controls();});
function finishDrag(){if(!drag)return;const u=drag.u;if(drag.changed)say(u.name+' moves '+(u.moveUsed-drag.origin.used).toFixed(1)+' inches.');drag=null;canvas.style.cursor="grab";render();}
canvas.addEventListener("pointerup",finishDrag);canvas.addEventListener("pointercancel",finishDrag);window.addEventListener("resize",setupCanvas);
reset();setupCanvas();
})();
</script>
