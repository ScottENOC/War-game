<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171c20">
<title>War-game — Core Battle Prototype</title>
<style>
:root{color-scheme:dark;--bg:#14191d;--panel:#20282d;--panel2:#293238;--line:#414c52;--text:#f0eee5;--muted:#aab4b8;--gold:#d5b66d;--red:#b9514b;--blue:#527ca2;--green:#7eaa83}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer;border:1px solid #657078;background:#344148;color:var(--text);border-radius:8px;padding:10px 13px;min-height:42px}button:hover:not(:disabled){background:#46575f;border-color:var(--gold)}button:disabled{opacity:.38;cursor:not-allowed}.primary{background:#876e38;border-color:#b99b59;color:#fff8e5}.danger{background:#713c3a;border-color:#a45b55}.quiet{background:transparent}
header{display:flex;align-items:center;gap:12px;padding:10px clamp(14px,3vw,30px);border-bottom:1px solid var(--line);background:#1a2024}
h1{font-size:16px;letter-spacing:.04em;margin:0}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:10px;color:var(--gold);font-weight:750}
main{max-width:1280px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}.battle{min-width:0}.statusbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.phase{font-weight:750;font-size:17px}.hint{color:var(--muted);font-size:13px}
#field{width:100%;display:block;aspect-ratio:1.45;background:#555f4b;border:1px solid #78816d;border-radius:12px;touch-action:none;cursor:grab}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.controls button{flex:1 1 135px}
.side{display:flex;flex-direction:column;gap:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);margin:0 0 10px}
.unitrow{display:flex;gap:10px;align-items:center}.shield{width:36px;height:42px;border:2px solid #d6c9a1;border-radius:9px 9px 14px 14px;display:grid;place-items:center;font-weight:900;font-size:12px}.shield.player{background:#3d6586}.shield.ai{background:#8b3935}.unitname{font-weight:750}.unitmeta{font-size:12px;color:var(--muted)}.numbers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.stat{background:var(--panel2);padding:7px 4px;text-align:center;border-radius:7px}.stat b{display:block;font-size:16px}.stat span{font-size:10px;color:var(--muted);text-transform:uppercase}
#log{max-height:280px;overflow:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:#d6dcda}.logentry{padding-bottom:7px;border-bottom:1px solid #343e43}.logentry:last-child{border:0}.dice{color:var(--gold);font-weight:750}.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:3px 8px;color:var(--muted);font-size:11px}
footer{max-width:1280px;margin:0 auto;padding:0 18px 24px;color:var(--muted);font-size:12px}.unit-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.unit-stats .stat{min-width:0}.unit-stats .stat.save b{font-size:13px}.detail-line{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
@media(max-width:850px){main{grid-template-columns:1fr;padding:12px}.side{display:grid;grid-template-columns:1fr}.side .logpanel{grid-column:auto}#field{aspect-ratio:1.15}.statusbar{align-items:flex-start;flex-direction:column}header{padding:10px 14px}}
@media(max-width:500px){.unit-stats{grid-template-columns:repeat(5,minmax(0,1fr))}#field{aspect-ratio:.95}.hint{font-size:12px}}
</style>
</head>
<body>
<header><h1>WAR-GAME</h1></header>
<main>
<section class="battle">
 <div class="statusbar"><div><div class="eyebrow" id="turnlabel">TURN 1</div><div class="phase" id="phaselabel">Movement — Charge declarations</div></div><div class="hint" id="instruction">Select your regiment, then declare a charge or move.</div></div>
 <canvas id="field" aria-label="Battlefield showing two regiment banners"></canvas>
 <div class="controls" id="controls"></div>
</section>
<aside class="side">
 <section class="panel" id="unitdetails">
  <h2>Selected unit</h2>
  <div class="unitrow"><div class="shield player" id="unitshield">✦</div><div><div class="unitname" id="detailname">Empire Swordsmen</div><div class="unitmeta" id="detailmeta">20 models · Hand weapon</div></div></div>
  <div class="unit-stats" id="unitstats"></div>
  <div class="detail-line unitmeta" id="unitformation"></div>
  <div class="detail-line unitmeta" id="unitrules"></div>
 </section>
 <section class="panel logpanel"><h2>Battle log</h2><div id="log" aria-live="polite"></div></section>
</aside>
</main>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const canvas = $("field"), ctx = canvas.getContext("2d");
const S = {
 turn:1, phase:"charges", active:"player", selected:"player", finished:false,
 units:{
  player:{id:"player",name:"Empire Swordsmen",side:"player",models:20,x:0.32,y:0.5,facing:0,engaged:false,activated:false,charged:false,fled:false,moveUsed:0,stats:{M:4,WS:3,BS:3,S:3,T:3,W:1,I:3,A:1,Ld:7,save:"-"}},
  ai:{id:"ai",name:"Opponent Swordsmen",side:"ai",models:20,x:0.68,y:0.5,facing:Math.PI,engaged:false,activated:false,charged:false,fled:false,moveUsed:0,stats:{M:4,WS:3,BS:3,S:3,T:3,W:1,I:3,A:1,Ld:7,save:"-"}}
 },
 log:[], pending:[], passes:{player:false,ai:false}, combatRound:0
};
const W=()=>canvas.clientWidth, H=()=>canvas.clientHeight;
const alive=u=>u.models>0;
const BATTLEFIELD_WIDTH_IN=48;
const MODEL_BASE_IN=0.9;
const MOVE_ALLOWANCE=4;
const PX_PER_IN=()=>W()/BATTLEFIELD_WIDTH_IN;
const fieldHeightIn=()=>H()/Math.max(1,PX_PER_IN());
const dist=()=>Math.hypot((S.units.player.x-S.units.ai.x)*BATTLEFIELD_WIDTH_IN,(S.units.player.y-S.units.ai.y)*fieldHeightIn());
function say(msg){S.log.unshift(msg);S.log=S.log.slice(0,45);$("log").innerHTML=S.log.map(x=>'<div class="logentry">'+x+'</div>').join("");}
function roll(n=1){return Array.from({length:n},()=>1+Math.floor(Math.random()*6));}
function d6(n=1){return roll(n).reduce((a,b)=>a+b,0);}
function setupCanvas(){const r=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
function draw(){
 const w=W(),h=H();if(!w||!h)return;
 ctx.clearRect(0,0,w,h);
 // textured-looking field and subtle terrain-free deployment grid
 ctx.fillStyle="#59654d";ctx.fillRect(0,0,w,h);
 ctx.strokeStyle="rgba(235,231,190,.12)";ctx.lineWidth=1;
 for(let x=0;x<w;x+=w/12){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
 for(let y=0;y<h;y+=h/8){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
 // central ground line
 ctx.strokeStyle="rgba(240,230,185,.32)";ctx.setLineDash([5,7]);ctx.beginPath();ctx.moveTo(w/2,12);ctx.lineTo(w/2,h-12);ctx.stroke();ctx.setLineDash([]);
 // show move / charge range when selecting during movement
 const p=S.units.player,a=S.units.ai;
 if(S.phase==="movement"&&S.selected==="player"&&!p.engaged){
  ctx.strokeStyle="rgba(160,205,230,.55)";ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(p.x*w,p.y*h);ctx.lineTo(p.x*w+Math.cos(p.facing)*p.stats.M*PX_PER_IN(),p.y*h+Math.sin(p.facing)*p.stats.M*PX_PER_IN());ctx.stroke();ctx.setLineDash([]);
 }
 drawUnit(p,w,h);drawUnit(a,w,h);

}
function unitCorners(u, atX=u.x, atY=u.y, atFacing=u.facing){
 const shape=formationShape(u),front=shape.front,depth=shape.depth;
 const fx=Math.cos(atFacing),fy=Math.sin(atFacing),lx=-fy,ly=fx;
 const cx=atX*W(),cy=atY*H();
 return [
  {x:cx-fx*depth/2-lx*front/2,y:cy-fy*depth/2-ly*front/2},
  {x:cx+fx*depth/2-lx*front/2,y:cy+fy*depth/2-ly*front/2},
  {x:cx+fx*depth/2+lx*front/2,y:cy+fy*depth/2+ly*front/2},
  {x:cx-fx*depth/2+lx*front/2,y:cy-fy*depth/2+ly*front/2}
 ];
}
function polygonOverlap(a,b){
 for(const poly of [a,b]){
  for(let i=0;i<poly.length;i++){
   const p1=poly[i],p2=poly[(i+1)%poly.length],ax=-(p2.y-p1.y),ay=p2.x-p1.x;
   const pA=a.map(p=>p.x*ax+p.y*ay),pB=b.map(p=>p.x*ax+p.y*ay);
   if(Math.max(...pA)<Math.min(...pB)+0.01||Math.max(...pB)<Math.min(...pA)+0.01)return false;
  }
 }
 return true;
}
function canPlace(u,x,y,facing){
 const poly=unitCorners(u,x,y,facing),w=W(),h=H();
 if(poly.some(p=>p.x<1||p.y<1||p.x>w-1||p.y>h-1))return false;
 const other=S.units[u.id==="player"?"ai":"player"];
 return !alive(other)||!polygonOverlap(poly,unitCorners(other));
}
function formationShape(u){
 const files=5,ranks=Math.max(1,Math.ceil(u.models/files)),base=MODEL_BASE_IN*PX_PER_IN();
 return {files,ranks,base,front:files*base,depth:ranks*base};
}
function drawUnit(u,w,h){
 const x=u.x*w,y=u.y*h,selected=S.selected===u.id&&!S.finished,shape=formationShape(u),{files,ranks,base,front,depth}=shape;
 ctx.save();ctx.translate(x,y);ctx.rotate(u.facing);
 ctx.fillStyle="rgba(0,0,0,.24)";ctx.fillRect(-depth/2+3,-front/2+4,depth,front);
 ctx.fillStyle=u.side==="player"?"#365e7e":"#813c36";ctx.strokeStyle=selected?"#f7d98b":"#e3d6b5";ctx.lineWidth=selected?2.5:1.2;
 ctx.fillRect(-depth/2,-front/2,depth,front);
 // Casualties are removed from the rear; surviving models stay in the front ranks.
 let remaining=u.models;
 for(let rank=0;rank<ranks;rank++){
  const count=Math.min(files,remaining),start=-front/2+(files-count)*base/2;
  for(let file=0;file<count;file++){
   const cx=depth/2-(rank+.5)*base,cy=start+file*base+base/2;
   ctx.fillStyle=u.side==="player"?"#456f91":"#a44a42";
   ctx.fillRect(cx-base/2+0.7,cy-base/2+0.7,base-1.4,base-1.4);
   ctx.strokeStyle="rgba(255,255,255,.8)";ctx.lineWidth=.9;ctx.strokeRect(cx-base/2+0.7,cy-base/2+0.7,base-1.4,base-1.4);
  }
  remaining-=count;
 }
 ctx.strokeStyle=selected?"#f7d98b":"#e3d6b5";ctx.lineWidth=selected?2.5:1.2;ctx.strokeRect(-depth/2,-front/2,depth,front);
 ctx.fillStyle="#f6e1a0";ctx.strokeStyle="#2a2a25";ctx.lineWidth=1;
 ctx.beginPath();ctx.moveTo(depth/2+9,0);ctx.lineTo(depth/2-1,-7);ctx.lineTo(depth/2-1,7);ctx.closePath();ctx.fill();ctx.stroke();
 if(selected&&S.phase==="movement"&&u.side==="player"&&!u.engaged&&!u.fled){
  ctx.fillStyle="#ffe3a0";
  for(const sign of [-1,1]){ctx.beginPath();ctx.arc(depth/2,sign*front/2,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#312b1e";ctx.stroke()}
 }
 ctx.restore();
 ctx.fillStyle="#fff8e9";ctx.font="bold 11px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.fillText(u.name,x,y-front/2-11);
 ctx.font="bold 14px system-ui";ctx.fillText(String(u.models),x,y+front/2+14);
 if(u.engaged){ctx.fillStyle="#f2d67d";ctx.font="bold 10px system-ui";ctx.fillText("IN MELEE",x,y+front/2+27)}
 if(u.fled){ctx.fillStyle="#ffb3ad";ctx.font="bold 10px system-ui";ctx.fillText("FLEEING",x,y+front/2+27)}
}
function setPhase(phase){S.phase=phase;S.active="player";S.passes={player:false,ai:false};S.units.player.activated=false;S.units.ai.activated=false;S.units.player.moveUsed=0;S.units.ai.moveUsed=0;render();}
function render(){
 $("turnlabel").textContent="TURN "+S.turn;
 const names={charges:"Movement — Charge declarations",movement:"Movement — Remaining moves",combat:"Melee — Attacks & combat resolution",break:"Combat resolution — Break test",over:"Battle complete"};
 $("phaselabel").textContent=names[S.phase]||S.phase;
 $("instruction").textContent=hint();
 const u=S.units[S.selected]||S.units.player,st=u.stats;
 $("unitshield").className="shield "+u.side;
 $("detailname").textContent=u.name;
 $("detailmeta").textContent=u.models+" models · "+(u.engaged?"In melee":u.fled?"Fleeing":"Hand weapon");
 $("unitstats").innerHTML=[["M",st.M],["WS",st.WS],["BS",st.BS],["S",st.S],["T",st.T],["W",st.W],["I",st.I],["A",st.A],["Ld",st.Ld],["Save",st.save]].map(([label,value])=>'<div class="stat '+(label==="Save"?"save":"")+'"><b>'+value+'</b><span>'+label+'</span></div>').join("");
 const shape=formationShape(u);
 $("unitformation").textContent="Formation: "+Math.min(5,u.models)+" files × "+shape.ranks+" ranks · "+u.models+" models";
 $("unitrules").textContent="Move allowance: "+st.M+" inches · Charge: up to "+(st.M*2)+" inches · Movement used this turn: "+u.moveUsed.toFixed(1)+" inches";
 draw();controls();
}
function hint(){
 if(S.finished)return "Battle ended. Start a fresh battle to play again.";
 if(S.phase==="charges")return S.active==="player"?"Declare a charge if the enemy is within 8 inches, or pass.":"AI passes on charge declarations.";
 if(S.phase==="movement")return S.active==="player"?"Drag the unit forward to advance, or drag a highlighted front corner to pivot. Combine moves up to 4 inches total.":"AI passes its movement activation.";
 if(S.phase==="combat")return "Both engaged units fight. Chargers strike first; otherwise Initiative decides.";
 if(S.phase==="break")return "Resolve the losing unit's Leadership test.";
 return "";
}
function btn(label,fn,cls="",disabled=false){const b=document.createElement("button");b.textContent=label;b.className=cls;b.disabled=disabled;b.onclick=fn;return b}
function controls(){
 const el=$("controls");el.replaceChildren();
 if(S.finished||S.phase==="over"){el.append(btn("New battle",reset,"primary"));return}
 if(S.phase==="charges"){
  if(S.active==="player"){
   const p=S.units.player,a=S.units.ai;
   el.append(btn("Declare charge",()=>declareCharge(), "primary",p.engaged||p.fled||p.charged||!alive(a)||dist()>S.units.player.stats.M*2));
   el.append(btn("Pass charges",()=>passCharge("player")));
  }else el.append(btn("AI passes",()=>passCharge("ai"),"",false));
  return;
 }
 if(S.phase==="movement"){
  if(S.active==="player"){
   const p=S.units.player;
   el.append(btn("Finish movement",()=>passMovement("player")));
   const remaining=Math.max(0,MOVE_ALLOWANCE-p.moveUsed);
   const meter=document.createElement("span");meter.className="pill";meter.textContent="Movement remaining: "+remaining.toFixed(1)+" inches";el.append(meter);
  }else el.append(btn("AI passes",()=>passMovement("ai")));
  return;
 }
 if(S.phase==="combat"){
  el.append(btn("Resolve melee combat",resolveCombat,"primary",!S.units.player.engaged||!S.units.ai.engaged));
  el.append(btn("Skip combat (no melee)",()=>endTurn(),"",S.units.player.engaged&&S.units.ai.engaged));
  return;
 }
 if(S.phase==="break")el.append(btn("Roll break test",resolveBreak,"primary"));
}
function declareCharge(){
 const p=S.units.player,a=S.units.ai;
 if(!alive(p)||!alive(a)||dist()>p.stats.M*2||p.engaged||p.fled)return;
 S.pending.push({from:"player",to:"ai",response:"hold"});
 say('<b>Empire Swordsmen</b> declare a charge. The AI chooses <b>Hold</b>.');
 // In a one-unit prototype the response is automatic; resolve charge immediately after declaration window.
 p.charged=true;p.activated=true;
 const gap=dist();
 if(gap<=8){p.x=a.x-(Math.sign(a.x-p.x)||1)*(5/BATTLEFIELD_WIDTH_IN);p.y=a.y;p.engaged=true;a.engaged=true;say('Charge succeeds — both regiments are now engaged.');}
 else say('Charge fails; the unit advances its normal move.');
 S.active="player";setPhase("movement");
}
function passCharge(side){
 if(side==="ai"){say("AI passes on declaring a charge.");S.passes.ai=true;S.active="player";render();return}
 say("You pass on further charge declarations.");S.passes.player=true;
 // Both have passed, move into remaining movement.
 setPhase("movement");
}
function movePlayer(){ /* Movement is performed directly on the battlefield by dragging. */ }
function passMovement(side){
 if(side==="ai"){say("AI passes its movement activation.");S.passes.ai=true;S.active="player";render();return}
 if(!S.units.player.activated&&!S.units.player.engaged&&!S.units.player.fled){S.units.player.activated=true;say("Empire Swordsmen remain in position.");}
 S.passes.player=true;
 if(S.units.player.engaged&&S.units.ai.engaged)setPhase("combat");else {setPhase("charges");S.turn++;say("Turn "+S.turn+" begins.");}
}
function hitTarget(attacker,defender){
 const a=attacker.stats.WS,d=defender.stats.WS;
 if(a>=d*2)return 3;if(a>d)return 3;if(a===d)return 4;if(a*2<=d)return 5;return 4;
}
function woundTarget(strength,toughness){
 if(strength>=toughness*2)return 2;if(strength>toughness)return 3;if(strength===toughness)return 4;
 if(strength*2<=toughness)return 6;return 5;
}
function saveTarget(defender,strength){
 const raw=defender.stats.save;
 if(raw==="-"||raw===null||raw===undefined)return null;
 const target=parseInt(raw,10);if(!Number.isFinite(target))return null;
 return target+Math.max(0,strength-3);
}
function attack(u,target){
 const attacks=Math.min(formationShape(u).files,u.models)*u.stats.A;
 const neededHit=hitTarget(u,target),neededWound=woundTarget(u.stats.S,target.stats.T),save=saveTarget(target,u.stats.S);
 const hitRolls=roll(attacks),hits=hitRolls.filter(x=>x>=neededHit).length,woundRolls=roll(hits),woundsBeforeSave=woundRolls.filter(x=>x>=neededWound).length;
 const saves=save===null?[]:roll(woundsBeforeSave),saved=save===null?0:saves.filter(x=>x>=save).length;
 return {attacks,hits,neededHit,woundsBeforeSave,neededWound,saved,wounds:Math.max(0,woundsBeforeSave-saved)};
}
function resolveCombat(){
 const p=S.units.player,a=S.units.ai;
 if(!p.engaged||!a.engaged){endTurn();return}
 S.combatRound++;
 const pFirst=p.charged&&!a.charged;
 let pr,ar;
 if(pFirst){
  pr=attack(p,a);a.models=Math.max(0,a.models-pr.wounds);
  ar=alive(a)?attack(a,p):null;
  if(ar)p.models=Math.max(0,p.models-ar.wounds);
 }else{
  pr=attack(p,a);ar=attack(a,p);
  a.models=Math.max(0,a.models-pr.wounds);
  p.models=Math.max(0,p.models-ar.wounds);
 }
 say('<b>Melee round '+S.combatRound+'</b> — Empire: '+pr.hits+'/'+pr.attacks+' hits, '+pr.wounds+' unsaved wounds. AI: '+(ar?ar.hits+'/'+ar.attacks+' hits, '+ar.wounds+' unsaved wounds':'no attacks (destroyed before striking)')+'.');
 draw();
 if(!alive(p)||!alive(a)){finishBattle(!alive(a)?"Empire wins the battle!":"AI wins the battle!");return}
 const crP=pr.wounds+rankBonus(p);const crA=(ar?ar.wounds:0)+rankBonus(a);
 const diff=crP-crA;
 say('Combat result — Empire '+crP+' (wounds '+pr.wounds+' + ranks '+rankBonus(p)+'), AI '+crA+' (wounds '+(ar?ar.wounds:0)+' + ranks '+rankBonus(a)+').');
 if(diff===0){say('Combat drawn; both units hold.');endTurn();return}
 S.loser=diff>0?"ai":"player";S.crDiff=Math.abs(diff);S.phase="break";render();
}
function rankBonus(u){return Math.min(3,Math.max(0,Math.floor((u.models-1)/5)));}
function resolveBreak(){
 const loser=S.units[S.loser];if(!loser||!alive(loser)){endTurn();return}
 const dice=roll(2),total=dice[0]+dice[1],ld=loser.stats.Ld-S.crDiff;
 say((loser.side==="player"?"Empire":"AI")+" break test: 2D6 = <span class='dice'>"+dice.join(" + ")+" = "+total+"</span>; modified Leadership "+Math.max(2,ld)+".");
 if(total>Math.max(2,ld)){
  loser.fled=true;loser.engaged=false;S.units[loser.side==="player"?"ai":"player"].engaged=false;
  say((loser.side==="player"?"Empire":"AI")+" fails the break test and flees. The opposing unit holds the field.");
  finishBattle((loser.side==="player"?"AI wins the battle!":"Empire wins the battle!"));
 }else{say((loser.side==="player"?"Empire":"AI")+" holds despite losing combat.");endTurn()}
}
function endTurn(){
 S.units.player.charged=false;S.units.ai.charged=false;
 S.units.player.engaged=alive(S.units.player)&&alive(S.units.ai)&&S.units.player.engaged;
 S.units.ai.engaged=S.units.player.engaged;
 S.turn++;S.units.player.activated=false;S.units.ai.activated=false;S.pending=[];
 if(S.units.player.engaged&&S.units.ai.engaged)setPhase("combat");else setPhase("charges");
}
function finishBattle(msg){S.finished=true;S.phase="over";say('<b>'+msg+'</b>');render()}
function reset(){
 S.turn=1;S.phase="charges";S.active="player";S.selected="player";S.finished=false;S.pending=[];S.passes={player:false,ai:false};S.combatRound=0;S.loser=null;S.crDiff=0;
 Object.assign(S.units.player,{models:20,x:.32,y:.5,facing:0,engaged:false,activated:false,charged:false,fled:false,moveUsed:0});
 Object.assign(S.units.ai,{models:20,x:.68,y:.5,facing:Math.PI,engaged:false,activated:false,charged:false,fled:false,moveUsed:0});
 S.log=[];$("log").replaceChildren();say("Battle deployed: 20 Empire Swordsmen face 20 opposing Swordsmen.");render();
}
let drag=null;
function pointerPoint(e){const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function near(a,b,r){return Math.hypot(a.x-b.x,a.y-b.y)<=r}
canvas.addEventListener("pointerdown",e=>{
 if(S.finished)return;
 const pt=pointerPoint(e),p=S.units.player,a=S.units.ai,w=W(),h=H();
 const dp=Math.hypot(pt.x-p.x*w,pt.y-p.y*h),da=Math.hypot(pt.x-a.x*w,pt.y-a.y*h);
 const chosen=dp<=da?p:a;S.selected=chosen.id;
 if(S.phase==="movement"&&S.active==="player"&&chosen===p&&!p.engaged&&!p.fled&&alive(p)){
  const shape=formationShape(p),front=shape.front,depth=shape.depth;
  const fx=Math.cos(p.facing),fy=Math.sin(p.facing),lx=-fy,ly=fx,cx=p.x*w,cy=p.y*h;
  const corners=[{x:cx+fx*depth/2+lx*front/2,y:cy+fy*depth/2+ly*front/2,sign:1},{x:cx+fx*depth/2-lx*front/2,y:cy+fy*depth/2-ly*front/2,sign:-1}];
  const corner=corners.find(c=>near(pt,c,16));
  drag={kind:corner?"pivot":"move",start:pt,origin:{x:p.x,y:p.y,facing:p.facing,used:p.moveUsed},pivot:corner?.sign??0,changed:false};
  if(corner){
   const sign=corner.sign,anchor={x:cx+fx*depth/2-lx*front/2*sign,y:cy+fy*depth/2-ly*front/2*sign};
   drag.anchor=anchor;
   const actual={x:cx+fx*depth/2+lx*front/2*sign,y:cy+fy*depth/2+ly*front/2*sign};
   drag.startAngle=Math.atan2(actual.y-anchor.y,actual.x-anchor.x);
  }
  canvas.setPointerCapture(e.pointerId);canvas.style.cursor="grabbing";e.preventDefault();
 }else render();
});
canvas.addEventListener("pointermove",e=>{
 if(!drag)return;
 const p=S.units.player,pt=pointerPoint(e),w=W(),h=H(),scale=PX_PER_IN();
 const remaining=Math.max(0,p.stats.M-drag.origin.used);
 if(drag.kind==="move"){
  const dx=(pt.x-drag.start.x)/scale,dy=(pt.y-drag.start.y)/scale;
  const along=dx*Math.cos(drag.origin.facing)+dy*Math.sin(drag.origin.facing);
  const advance=Math.max(0,Math.min(remaining,along));
  const steps=Math.max(1,Math.ceil(advance/0.1));let best=0;
  for(let i=1;i<=steps;i++){
   const amount=advance*i/steps,x=drag.origin.x+Math.cos(drag.origin.facing)*amount/BATTLEFIELD_WIDTH_IN;
   const y=drag.origin.y+Math.sin(drag.origin.facing)*amount/BATTLEFIELD_WIDTH_IN;
   if(!canPlace(p,x,y,drag.origin.facing))break;best=amount;
  }
  p.x=drag.origin.x+Math.cos(drag.origin.facing)*best/BATTLEFIELD_WIDTH_IN;
  p.y=drag.origin.y+Math.sin(drag.origin.facing)*best/BATTLEFIELD_WIDTH_IN;
  p.facing=drag.origin.facing;p.moveUsed=drag.origin.used+best;drag.changed=best>0;
 }else{
  const anchor=drag.anchor,angle=Math.atan2(pt.y-anchor.y,pt.x-anchor.x);
  let delta=angle-drag.startAngle;while(delta>Math.PI)delta-=Math.PI*2;while(delta< -Math.PI)delta+=Math.PI*2;
  const shape=formationShape(p),front=shape.front,depth=shape.depth;
  const maxAngle=remaining/Math.max(0.01,front/scale);
  delta=Math.max(-maxAngle,Math.min(maxAngle,delta));
  const steps=Math.max(1,Math.ceil(Math.abs(delta)/0.025));let best=0;
  for(let i=1;i<=steps;i++){
   const d=delta*i/steps,newFacing=drag.origin.facing+d,sign=drag.pivot;
   const ax=anchor.x/w,ay=anchor.y/h,fx=Math.cos(newFacing),fy=Math.sin(newFacing),lx=-fy,ly=fx;
   const cx=anchor.x-fx*depth/2+lx*front/2*sign,cy=anchor.y-fy*depth/2+ly*front/2*sign;
   if(!canPlace(p,cx/w,cy/h,newFacing))break;best=d;
  }
  const facing=drag.origin.facing+best,fx=Math.cos(facing),fy=Math.sin(facing),lx=-fy,ly=fx,sign=drag.pivot;
  const cx=anchor.x-fx*depth/2+lx*front/2*sign,cy=anchor.y-fy*depth/2+ly*front/2*sign;
  p.x=cx/w;p.y=cy/h;p.facing=facing;p.moveUsed=drag.origin.used+Math.abs(best)*(formationShape(p).front/PX_PER_IN());drag.changed=Math.abs(best)>0.001;
 }
 draw();controls();
});
function finishDrag(){
 if(!drag)return;
 const p=S.units.player,changed=drag.changed,kind=drag.kind;
 if(changed)say(kind==="move"?"Empire Swordsmen advance "+(p.moveUsed-drag.origin.used).toFixed(1)+" inches.":"Empire Swordsmen pivot; movement spent "+(p.moveUsed-drag.origin.used).toFixed(1)+" inches.");
 drag=null;canvas.style.cursor="grab";render();
}
canvas.addEventListener("pointerup",finishDrag);
canvas.addEventListener("pointercancel",finishDrag);
window.addEventListener("resize",setupCanvas);
reset();setupCanvas();
})();
</script>
