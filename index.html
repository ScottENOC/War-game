<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171c20">
<title>War-game — Core Battle Prototype</title>
<style>
:root{color-scheme:dark;--gold:#e0c276;--glass:rgba(18,24,27,.68);--line:rgba(233,229,207,.28);--text:#f5f1e5}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#59654d;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:13px;min-width:46px;min-height:46px;padding:8px;font-size:22px;box-shadow:0 3px 12px #0003}
button:active{transform:scale(.96)}button:disabled{opacity:.3}
#field{position:fixed;inset:0;width:100vw;height:100dvh;display:block;touch-action:none;cursor:grab}
#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 9px calc(env(safe-area-inset-bottom) + 8px);gap:8px}
.cards{display:flex;justify-content:center;gap:8px;pointer-events:auto}
.unit-card{width:66px;height:58px;min-width:0;min-height:0;padding:5px;display:flex;align-items:center;justify-content:center;position:relative;border-radius:12px;background:rgba(16,22,25,.57);border:1px solid rgba(255,255,255,.25)}
.unit-card.selected{outline:2px solid #ffe39b;background:rgba(71,78,65,.8)}
.unit-card.unmoved{box-shadow:inset 0 0 0 2px #e0c276}
.unit-card .sigil{font-size:27px;line-height:1}
.unit-card .count{position:absolute;right:3px;bottom:2px;border-radius:6px;padding:0px 4px;font-size:11px;font-weight:800;background:#101619d9}
.unit-card .bar{position:absolute;left:5px;right:5px;bottom:0;height:3px;border-radius:3px;background:#d0bd8a}
.unit-card .bar.ai{background:#ba6158}
#actions{display:flex;justify-content:center;gap:7px;pointer-events:auto;flex-wrap:wrap}
#actions button{width:48px;height:48px;padding:0}
#actions button.active{outline:2px solid var(--gold);background:rgba(100,83,43,.8)}
#logtoggle{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 10px);pointer-events:auto;width:42px;height:42px;min-width:42px;min-height:42px;font-size:20px}
#logpanel{position:fixed;z-index:8;inset:8% 7% 8%;display:none;pointer-events:auto;background:rgba(17,23,26,.88);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:12px;overflow:hidden;flex-direction:column}
#logpanel.open{display:flex}
#loghead{display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
#log{overflow:auto;display:flex;flex-direction:column;gap:9px;padding:10px 4px;font-size:12px;line-height:1.4}
.logentry{padding:0 0 8px;border-bottom:1px solid #ffffff1c}
#rollview{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,620px);max-height:62dvh;overflow:auto;pointer-events:auto;background:rgba(16,22,25,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.25);border-radius:15px;padding:9px;display:none}
#rollview.show{display:block}
#rollclose{position:sticky;float:right;top:0;z-index:2;min-width:34px;min-height:34px;width:34px;height:34px;padding:0;font-size:19px}
.dice-stack{display:grid;gap:5px;margin-top:3px;padding:7px;background:transparent;border:0;border-radius:8px}
.dice-duel{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dice-side{min-width:0;border:1px solid #ffffff2a;border-radius:9px;padding:7px}.dice-side h3{font-size:11px;margin:0 0 5px;color:#f7e7b5}
.dice-lane{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin:5px 0}.lane-label{width:100%;font-size:10px;color:#e0ded3}
.die{width:29px;height:29px;display:inline-grid;place-items:center;border:1px solid #b2b8b5;border-radius:7px;background:#39464b;color:#fff;font-size:13px;font-weight:850;box-shadow:0 2px 4px #0005;animation:rollin .38s cubic-bezier(.2,.8,.2,1) both}
.die.success{background:#276847;border-color:#75d49b;color:#e9fff0}.die.fail{background:#813e3b;border-color:#e28b83;color:#fff0ed}.die.save{background:#285b7b;border-color:#86c9ed;color:#eaf8ff}
@keyframes rollin{0%{transform:translateY(-35px) rotate(100deg) scale(.55);opacity:0}70%{transform:translateY(4px) rotate(-10deg) scale(1.08);opacity:1}100%{transform:translateY(0) rotate(0) scale(1);opacity:1}}
.rollsummary{font-size:12px;color:#f1ead7;margin-top:5px}
@media(max-width:520px){.unit-card{width:59px;height:52px}.unit-card .sigil{font-size:24px}#actions{gap:5px}#actions button{width:43px;height:43px;min-width:43px;min-height:43px;font-size:20px}#rollview{top:45%;max-height:55dvh}.dice-duel{grid-template-columns:1fr 1fr}.die{width:25px;height:25px}}
</style>
</head>
<body>
<canvas id="field" aria-label="Full-screen battlefield"></canvas>
<div id="hud">
 <div class="cards" id="enemycards" aria-label="Opponent units"></div>
 <div id="actions" aria-label="Battle actions"></div>
 <div class="cards" id="playercards" aria-label="Your units"></div>
</div>
<button id="logtoggle" aria-label="Battle log" title="Battle log">▤</button>
<section id="logpanel" aria-label="Battle log">
 <div id="loghead"><button id="logclose" aria-label="Close log">×</button></div>
 <div id="log"></div>
</section>
<section id="rollview" aria-live="polite"><button id="rollclose" aria-label="Close dice">×</button><div id="rollcontent"></div></section>
<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const canvas = $("field"), ctx = canvas.getContext("2d");
const BATTLEFIELD_WIDTH_IN=48, MODEL_BASE_IN=.9, BOW_RANGE=24;
const S={
 turn:1,phase:"charges",selected:"pSword",finished:false,combatRound:0,loser:null,crDiff:0,log:[],mode:null,
 units:{
  pSword:{id:"pSword",name:"Empire Swordsmen",short:"Swordsmen",side:"player",kind:"melee",models:20,startModels:20,x:.22,y:.36,facing:0,engaged:false,activated:false,moved:false,shot:false,charged:false,fled:false,moveUsed:0,damage:0,shootCasualties:0,panicTested:false,stats:{M:4,WS:4,BS:3,S:3,T:3,W:1,I:3,A:1,Ld:7,save:"4+"}},
  pArch:{id:"pArch",name:"Empire Archers",short:"Archers",side:"player",kind:"archer",models:10,startModels:10,x:.22,y:.70,facing:0,engaged:false,activated:false,moved:false,shot:false,charged:false,fled:false,moveUsed:0,damage:0,shootCasualties:0,panicTested:false,stats:{M:4,WS:3,BS:3,S:3,T:3,W:1,I:3,A:1,Ld:7,save:"-"}},
  aSword:{id:"aSword",name:"Opposing Swordsmen",short:"Swordsmen",side:"ai",kind:"melee",models:20,startModels:20,x:.78,y:.36,facing:Math.PI,engaged:false,activated:false,moved:false,shot:false,charged:false,fled:false,moveUsed:0,damage:0,shootCasualties:0,panicTested:false,stats:{M:4,WS:4,BS:3,S:3,T:3,W:1,I:3,A:1,Ld:7,save:"4+"}},
  aArch:{id:"aArch",name:"Opposing Archers",short:"Archers",side:"ai",kind:"archer",models:10,startModels:10,x:.78,y:.70,facing:Math.PI,engaged:false,activated:false,moved:false,shot:false,charged:false,fled:false,moveUsed:0,damage:0,shootCasualties:0,panicTested:false,stats:{M:4,WS:3,BS:3,S:3,T:3,W:1,I:3,A:1,Ld:7,save:"-"}}
 }
};
const units=()=>Object.values(S.units), alive=u=>u.models>0;
const W=()=>canvas.clientWidth,H=()=>canvas.clientHeight,PX_PER_IN=()=>W()/BATTLEFIELD_WIDTH_IN,fieldHeightIn=()=>H()/Math.max(1,PX_PER_IN());
const dist=(a,b)=>Math.hypot((a.x-b.x)*BATTLEFIELD_WIDTH_IN,(a.y-b.y)*fieldHeightIn());
const enemies=u=>units().filter(v=>v.side!==u.side&&alive(v));
function say(msg){S.log.unshift(msg);S.log=S.log.slice(0,80);$("log").innerHTML=S.log.map(x=>'<div class="logentry">'+x+'</div>').join("");if(msg.includes("dice-stack")||msg.includes("dice-duel")){$("rollcontent").innerHTML=msg;$("rollview").classList.add("show");}if($("logpanel").classList.contains("open"))$("log").scrollTop=0;}
function roll(n){return Array.from({length:n},()=>1+Math.floor(Math.random()*6));}
function dieHtml(n,pass,kind){return '<span class="die '+(pass?'success':'fail')+(kind==='save'?' save':'')+'" title="'+(pass?'success':'failure')+'">'+n+'</span>';}
function lane(label,values,threshold,mode){return '<div class="dice-lane"><span class="lane-label">'+label+'</span>'+values.map(v=>dieHtml(v,mode==='save'?v>=threshold:v>=threshold,mode)).join("")+'</div>';}
function diceStack(u,r){
 let out='<div class="dice-stack"><b>'+u.name+'</b>';
 out+=lane('To hit — need '+(r.hitNeed>6?'7+ (impossible)':r.hitNeed+'+'),r.hitRolls,r.hitNeed,'hit');
 out+=lane('To wound — '+r.hits+' hits; need '+r.woundNeed+'+',r.woundRolls,r.woundNeed,'wound');
 if(r.saveNeed!==null)out+=lane('Armour saves — '+r.woundsBeforeSave+' wounds; need '+(r.saveNeed>6?'7+ (impossible)':r.saveNeed+'+'),r.saveRolls,r.saveNeed,'save');
 out+='<div class="unitmeta">Result: '+r.hits+' hits, '+r.woundsBeforeSave+' wounds, '+r.saved+' saved, <b>'+r.wounds+' unsaved</b>.</div></div>';return out;
}
function diceDuel(title,r1,r2){return '<div><b>'+title+'</b><div class="dice-duel">'+(r1?'<div class="dice-side"><h3>Player</h3>'+diceStack(S.units.pSword.side==='player'?S.units.pSword:S.units.pArch,r1)+'</div>':'')+(r2?'<div class="dice-side"><h3>Opponent</h3>'+diceStack(S.units.aSword.side==='ai'?S.units.aSword:S.units.aArch,r2)+'</div>':'')+'</div></div>';}
function setupCanvas(){const r=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
function shape(u){const files=5,ranks=Math.max(1,Math.ceil(u.models/files)),base=MODEL_BASE_IN*PX_PER_IN();return {files,ranks,base,front:files*base,depth:ranks*base};}
function corners(u,x=u.x,y=u.y,f=u.facing){const q=shape(u),fx=Math.cos(f),fy=Math.sin(f),lx=-fy,ly=fx,cx=x*W(),cy=y*H(),front=q.front/2,depth=q.depth/2;return [{x:cx-fx*depth-lx*front,y:cy-fy*depth-ly*front},{x:cx+fx*depth-lx*front,y:cy+fy*depth-ly*front},{x:cx+fx*depth+lx*front,y:cy+fy*depth+ly*front},{x:cx-fx*depth+lx*front,y:cy-fy*depth+ly*front}];}
function overlap(a,b){for(const poly of [a,b])for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length],ax=-(q.y-p.y),ay=q.x-p.x,A=a.map(v=>v.x*ax+v.y*ay),B=b.map(v=>v.x*ax+v.y*ay);if(Math.max(...A)<Math.min(...B)+.01||Math.max(...B)<Math.min(...A)+.01)return false;}return true;}
function canPlace(u,x,y,f){const poly=corners(u,x,y,f),w=W(),h=H();if(poly.some(p=>p.x<1||p.y<1||p.x>w-1||p.y>h-1))return false;return !units().some(v=>v!==u&&alive(v)&&overlap(poly,corners(v)));}
function drawCone(u){if(u.side!=="player"||u.engaged||u.fled||u.charged||!alive(u)||S.phase==="combat"||S.phase==="over")return;const q=shape(u),x=u.x*W(),y=u.y*H(),f=u.facing,range=u.stats.M*2*PX_PER_IN(),half=Math.PI/4,front=q.depth/2,fy=-Math.sin(f),fx=Math.cos(f),left=-Math.sin(f),ly=Math.cos(f);const sx=x+fx*front,sy=y+fy*front;ctx.save();ctx.fillStyle="rgba(229,195,105,.13)";ctx.strokeStyle="rgba(250,220,140,.7)";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(sx+left*q.front/2,sy+ly*q.front/2);ctx.lineTo(sx+left*q.front/2+Math.cos(f-half)*range,sy+ly*q.front/2+Math.sin(f-half)*range);ctx.arc(sx,sy,range,f-half,f+half);ctx.lineTo(sx+left*q.front/2,sy+ly*q.front/2);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
function drawUnit(u){if(!alive(u))return;const w=W(),h=H(),x=u.x*w,y=u.y*h,q=shape(u),selected=S.selected===u.id,base=q.base;ctx.save();ctx.translate(x,y);ctx.rotate(u.facing);
 ctx.fillStyle="rgba(0,0,0,.24)";ctx.fillRect(-q.depth/2+3,-q.front/2+4,q.depth,q.front);
 ctx.fillStyle=u.side==="player"?(u.kind==="archer"?"#4b8065":"#365e7e"):(u.kind==="archer"?"#a17b42":"#813c36");ctx.fillRect(-q.depth/2,-q.front/2,q.depth,q.front);
 let left=u.models;for(let rank=0;rank<q.ranks;rank++){const count=Math.min(q.files,left);for(let file=0;file<count;file++){const cx=q.depth/2-(rank+.5)*base,cy=-q.front/2+(file+.5)*base;ctx.fillStyle=u.side==="player"?(u.kind==="archer"?"#71aa84":"#456f91"):(u.kind==="archer"?"#c4a05f":"#a44a42");ctx.fillRect(cx-base/2+.7,cy-base/2+.7,base-1.4,base-1.4);ctx.strokeStyle="rgba(255,255,255,.8)";ctx.lineWidth=.9;ctx.strokeRect(cx-base/2+.7,cy-base/2+.7,base-1.4,base-1.4);}left-=count;}
 ctx.strokeStyle=selected?"#f7d98b":"#e3d6b5";ctx.lineWidth=selected?3:1.2;ctx.strokeRect(-q.depth/2,-q.front/2,q.depth,q.front);
 ctx.fillStyle="#f6e1a0";ctx.strokeStyle="#2a2a25";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(q.depth/2+9,0);ctx.lineTo(q.depth/2-1,-7);ctx.lineTo(q.depth/2-1,7);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
 ctx.fillStyle="#fff8e9";ctx.font="bold 11px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(u.short,x,y-q.front/2-11);ctx.font="bold 14px system-ui";ctx.fillText(String(u.models),x,y+q.front/2+14);if(u.engaged){ctx.fillStyle="#f2d67d";ctx.font="bold 10px system-ui";ctx.fillText("IN MELEE",x,y+q.front/2+27)}if(u.fled){ctx.fillStyle="#ffb3ad";ctx.font="bold 10px system-ui";ctx.fillText("FLEEING",x,y+q.front/2+27);}
}
function draw(){const w=W(),h=H();if(!w||!h)return;ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(view.x,view.y);ctx.scale(view.zoom,view.zoom);ctx.fillStyle="#59654d";ctx.fillRect(0,0,w,h);ctx.strokeStyle="rgba(235,231,190,.12)";ctx.lineWidth=1;for(let x=0;x<w;x+=w/12){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=h/8){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.strokeStyle="rgba(240,230,185,.32)";ctx.setLineDash([5,7]);ctx.beginPath();ctx.moveTo(w/2,12);ctx.lineTo(w/2,h-12);ctx.stroke();ctx.setLineDash([]);const selected=S.units[S.selected];if(selected)drawCone(selected);units().forEach(drawUnit);ctx.restore();}
function rankBonus(u){return Math.min(3,Math.max(0,Math.floor(u.models/5)-1));}
function hitTarget(attacker,defender){const a=attacker.stats.WS,d=defender.stats.WS;if(a>=d*2)return 3;if(a>d)return 3;if(a===d)return 4;if(a*2<=d)return 5;return 4;}
function woundTarget(s,t){if(s>=t*2)return 2;if(s>t)return 3;if(s===t)return 4;if(s*2<=t)return 6;return 5;}
function saveTarget(defender,strength){const raw=defender.stats.save;if(raw==="-"||raw==null)return null;const t=parseInt(raw,10);return Number.isFinite(t)?t+Math.max(0,strength-3):null;}
function applyDamage(u,wounds,shooting){const before=u.models,total=(u.damage||0)+wounds,killed=Math.floor(total/u.stats.W);u.models=Math.max(0,u.models-killed);u.damage=u.models?total%u.stats.W:0;if(shooting)u.shootCasualties+=before-u.models;return before-u.models;}
function meleeAttack(u,target){const attacks=Math.min(5,u.models)*u.stats.A,hitNeed=hitTarget(u,target),woundNeed=woundTarget(u.stats.S,target.stats.T),saveNeed=saveTarget(target,u.stats.S),hitRolls=roll(attacks),hits=hitRolls.filter(x=>x>=hitNeed).length,woundRolls=roll(hits),woundsBeforeSave=woundRolls.filter(x=>x>=woundNeed).length,saveRolls=saveNeed===null?[]:roll(woundsBeforeSave),saved=saveNeed===null?0:saveRolls.filter(x=>x>=saveNeed).length;return {attacks,hitNeed,hitRolls,hits,woundNeed,woundRolls,woundsBeforeSave,saveNeed,saveRolls,saved,wounds:Math.max(0,woundsBeforeSave-saved)};}
function bsTarget(u,target,longRange,moved,standShoot){let need=u.stats.BS>=5?2:u.stats.BS===4?3:u.stats.BS===3?4:u.stats.BS===2?5:6;if(longRange)need++;if(moved)need++;if(standShoot)need++;return Math.min(7,need);}
function shootAttack(u,target,standShoot){const d=dist(u,target),longRange=d>BOW_RANGE/2,hitNeed=bsTarget(u,target,longRange,u.moved,standShoot),shots=Math.min(10,u.models),hitRolls=roll(shots),hits=hitRolls.filter(x=>x>=hitNeed).length,woundNeed=woundTarget(u.stats.S,target.stats.T),woundRolls=roll(hits),woundsBeforeSave=woundRolls.filter(x=>x>=woundNeed).length,saveNeed=saveTarget(target,u.stats.S),saveRolls=saveNeed===null?[]:roll(woundsBeforeSave),saved=saveNeed===null?0:saveRolls.filter(x=>x>=saveNeed).length;return {attacks:shots,hitNeed,hitRolls,hits,woundNeed,woundRolls,woundsBeforeSave,saveNeed,saveRolls,saved,wounds:Math.max(0,woundsBeforeSave-saved),longRange,moved:u.moved,standShoot,distance:d};}
function showAttack(label,u,target,r,kind){const extra=(kind==="shoot"?' · '+(r.longRange?'long range ':'')+(r.moved?'moved ':'')+(r.standShoot?'stand & shoot':''):'');const distText=Number.isFinite(r.distance)?' · '+r.distance.toFixed(1)+'"':'';const stack=diceStack(u,r);say('<b>'+label+': '+u.name+' → '+target.name+'</b><div class="rollsummary">'+r.attacks+(kind==="shoot"?" shots":" attacks")+distText+extra+'</div>'+stack);$("rollcontent").innerHTML=stack;$("rollview").classList.add("show");}
function panicTest(target){if(target.panicTested)return;const threshold=Math.ceil(target.startModels*.25);if(target.shootCasualties<threshold||!alive(target))return;target.panicTested=true;const dice=roll(2),total=dice[0]+dice[1];say('<b>Panic test — '+target.name+'</b>: shooting casualties '+target.shootCasualties+'/'+target.startModels+' (25% threshold '+threshold+'). 2D6 <span class="dice">'+dice.join(' + ')+' = '+total+'</span>; need '+target.stats.Ld+' or less.');if(total>target.stats.Ld){target.fled=true;target.engaged=false;say(target.name+' fails its unmodified Leadership test and flees.');}}
function shoot(u,target,standShoot){if(!alive(u)||!alive(target)||u.kind!=="archer"||u.shot||u.engaged||target.engaged)return false;const d=dist(u,target);if(d>BOW_RANGE)return false;if(standShoot&&d<=4)return false;const r=shootAttack(u,target,standShoot);u.shot=true;showAttack(standShoot?"Stand and shoot":"Shooting",u,target,r,"shoot");const killed=applyDamage(target,r.wounds,true);say(target.name+' loses '+killed+' model'+(killed===1?'':'s')+' to shooting.');if(!standShoot)panicTest(target);return true;}
function closestEnemy(u){return enemies(u).sort((a,b)=>dist(u,a)-dist(u,b))[0]||null;}
function selectedTarget(u){const list=enemies(u);return list.find(v=>v.id===S.targetId)||closestEnemy(u);}
function renderRoster(){for(const side of ["ai","player"]){const el=$(side==="ai"?"enemycards":"playercards");el.innerHTML="";units().filter(u=>u.side===side).forEach(u=>{const b=document.createElement("button");b.className="unit-card"+(u.id===S.selected?" selected":"")+(side==="player"&&!u.moved&&!u.shot&&!u.fled?" unmoved":"");b.setAttribute("aria-label",u.name+" "+u.models+" models");b.title=u.name;b.innerHTML='<span class="sigil">'+(u.kind==="archer"?"🏹":"⚔")+'</span><span class="count">'+u.models+'</span><span class="bar '+(side==="ai"?"ai":"")+'"></span>';b.onclick=()=>{S.selected=u.id;S.mode=null;render();};el.append(b);});}}
function render(){const u=S.units[S.selected];renderRoster();draw();controls();}
function hint(){return "";}
function btn(label,icon,fn,disabled,active){const b=document.createElement("button");b.textContent=icon;b.title=label;b.setAttribute("aria-label",label);b.disabled=!!disabled;if(active)b.classList.add("active");b.onclick=fn;$("actions").append(b);}
function controls(){const el=$("actions");el.replaceChildren();if(S.finished){btn("New battle","↻",reset,false);return;}const u=S.units[S.selected],target=selectedTarget(u);
 if(S.phase==="charges"){btn("Declare charge","➜",()=>{S.mode=S.mode==="charge"?null:"charge";render();},!u||u.side!=="player"||u.engaged||u.fled||u.charged||!target||target.engaged||dist(u,target)>u.stats.M*2,S.mode==="charge");btn("Pass charges","Ⅱ",()=>{say("Charges passed.");setPhase("movement");});return;}
 if(S.phase==="movement"){btn("Move","↔",()=>{S.mode=S.mode==="move"?null:"move";render();},!u||u.side!=="player"||u.engaged||u.fled||u.shot||u.moveUsed>=u.stats.M,S.mode==="move");btn("Shoot","◎",()=>{S.mode=S.mode==="shoot"?null:"shoot";render();},!u||u.side!=="player"||u.kind!=="archer"||u.shot||u.engaged,S.mode==="shoot");btn("Finish phase","▶",finishMovement);return;}
 if(S.phase==="combat"){btn("Resolve melee","⚔",resolveCombat,!units().some(v=>v.side==="player"&&v.engaged&&alive(v)));btn("End turn","▶",endTurn,!units().some(v=>v.engaged&&alive(v)));return;}

}
function setPhase(p){S.phase=p;units().forEach(u=>{u.activated=false;if(p==="charges"||p==="movement"){u.moved=false;u.moveUsed=0;}if(p==="charges"){u.shot=false;u.shootCasualties=0;u.panicTested=false;}});S.targetId=null;render();}
function declareCharge(u,target){if(!u||!target||u.side!=="player"||u.engaged||u.fled||dist(u,target)>u.stats.M*2)return;const gap=dist(u,target);if(target.kind==="archer"&&gap>4&&gap<=BOW_RANGE){say(target.name+' chooses Stand and Shoot.');shoot(target,u,true);if(!alive(u)){render();return;}if(u.fled){say(u.name+' flees after the shooting reaction; the charge does not make contact.');render();return;}}if(gap<=u.stats.M*2&&alive(u)&&alive(target)&&!target.fled){const q=shape(u),t=shape(target),dir=target.x>=u.x?1:-1;u.x=target.x-dir*(q.depth+t.depth)/2/BATTLEFIELD_WIDTH_IN;u.y=target.y;u.engaged=true;target.engaged=true;u.charged=true;say(u.name+' charges '+target.name+' and makes contact.');}else say(u.name+' charge fails.');render();}
function finishMovement(){units().filter(u=>u.side==="ai"&&u.kind==="archer"&&!u.shot&&!u.engaged&&alive(u)).forEach(u=>{const t=enemies(u).filter(v=>!v.engaged).sort((a,b)=>dist(u,a)-dist(u,b))[0];if(t&&dist(u,t)<=BOW_RANGE)shoot(u,t,false);});units().forEach(u=>{if(u.side==="player"&&!u.moved)u.activated=true;});if(units().some(u=>u.engaged&&alive(u)))setPhase("combat");else{S.turn++;setPhase("charges");say("Turn "+S.turn+" begins.");}}
function resolveCombat(){const pairs=[];units().filter(u=>u.engaged&&alive(u)).forEach(u=>{const target=units().find(v=>v.engaged&&v.side!==u.side&&alive(v)&&dist(u,v)<4);if(target&&!pairs.some(p=>p.includes(u)||p.includes(target)))pairs.push([u,target]);});if(!pairs.length){say("No units are in melee.");endTurn();return;}S.combatRound++;let tests=[];
 pairs.forEach(pair=>{let p=pair[0],a=pair[1];if(p.side==="ai"){const tmp=p;p=a;a=tmp;}const pFirst=(p.charged&&!a.charged)||(!p.charged&&!a.charged&&p.stats.I>a.stats.I),aFirst=(a.charged&&!p.charged)||(!p.charged&&!a.charged&&a.stats.I>p.stats.I);let pr=null,ar=null;if(pFirst){pr=meleeAttack(p,a);applyDamage(a,pr.wounds,false);if(alive(a)){ar=meleeAttack(a,p);applyDamage(p,ar.wounds,false);}}else if(aFirst){ar=meleeAttack(a,p);applyDamage(p,ar.wounds,false);if(alive(p)){pr=meleeAttack(p,a);applyDamage(a,pr.wounds,false);}}else{pr=meleeAttack(p,a);ar=meleeAttack(a,p);applyDamage(a,pr.wounds,false);applyDamage(p,ar.wounds,false);}
 if(!pFirst&&!aFirst&&pr&&ar)say('<b>Simultaneous melee dice</b><div class="dice-duel"><div class="dice-side"><h3>'+p.name+' attacks '+a.name+'</h3>'+diceStack(p,pr)+'</div><div class="dice-side"><h3>'+a.name+' attacks '+p.name+'</h3>'+diceStack(a,ar)+'</div></div>');else{if(pr)say('<b>Melee dice — '+p.name+' attacks '+a.name+'</b>'+diceStack(p,pr));if(ar)say('<b>Melee dice — '+a.name+' attacks '+p.name+'</b>'+diceStack(a,ar));}if(!alive(p)||!alive(a))return;const crP=pr?pr.wounds:0,crA=ar?ar.wounds:0,scoreP=crP+rankBonus(p),scoreA=crA+rankBonus(a),diff=scoreP-scoreA;say('Combat resolution: '+p.name+' '+scoreP+' (unsaved wounds '+crP+' + rank bonus '+rankBonus(p)+') vs '+a.name+' '+scoreA+' (unsaved wounds '+crA+' + rank bonus '+rankBonus(a)+').');if(diff!==0)tests.push({loser:diff>0?a:p,diff:Math.abs(diff)});});
 if(units().filter(alive).filter(u=>u.side==="player").length===0){finishBattle("Opponent wins the battle!");return;}if(units().filter(alive).filter(u=>u.side==="ai").length===0){finishBattle("Player wins the battle!");return;}if(tests.length){const worst=tests.sort((a,b)=>b.diff-a.diff)[0];S.loser=worst.loser;S.crDiff=worst.diff;S.phase="break";render();}else{say("Combat drawn; engaged units hold.");endTurn();}}
function resolveBreak(){const u=S.loser;if(!u||!alive(u)){endTurn();return;}const dice=roll(2),total=dice[0]+dice[1],needed=Math.max(2,u.stats.Ld-S.crDiff);say('<b>Break test — '+u.name+'</b>: 2D6 <span class="dice">'+dice.join(' + ')+' = '+total+'</span>; need '+needed+' or less (Leadership '+u.stats.Ld+' − combat result '+S.crDiff+').');if(total>needed){u.fled=true;u.engaged=false;say(u.name+' fails its break test and flees.');}else say(u.name+' holds.');if(units().filter(alive).every(v=>v.fled)||units().filter(v=>v.side==="player"&&alive(v)).length===0||units().filter(v=>v.side==="ai"&&alive(v)).length===0){finishBattle(units().some(v=>v.side==="player"&&alive(v)&&!v.fled)?"Player wins the battle!":"Opponent wins the battle!");}else endTurn();}
function endTurn(){units().forEach(u=>{u.charged=false;if(!alive(u)||!units().some(v=>v.side!==u.side&&alive(v)&&v.engaged&&dist(u,v)<4))u.engaged=false;});S.turn++;say("Turn "+S.turn+" begins.");setPhase("charges");}
function finishBattle(msg){S.finished=true;S.phase="over";say('<b>'+msg+'</b>');render();}
function reset(){S.turn=1;S.phase="charges";S.selected="pSword";S.mode=null;view.zoom=1;view.x=0;view.y=0;S.finished=false;S.combatRound=0;S.loser=null;S.crDiff=0;S.log=[];units().forEach(u=>Object.assign(u,{models:u.startModels,damage:0,x:(u.id==="pSword"||u.id==="pArch") ? 0.22 : 0.78,y:(u.id==="pSword"||u.id==="aSword") ? 0.36 : 0.70,facing:u.side==="player"?0:Math.PI,engaged:false,activated:false,moved:false,shot:false,charged:false,fled:false,moveUsed:0,shootCasualties:0,panicTested:false}));$("log").replaceChildren();say("Battle deployed: 20 swordsmen and 10 archers on each side.");render();}
let drag=null;const view={zoom:1,x:0,y:0};const pointers=new Map();let pinch=null;
function pointerPoint(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left-view.x)/view.zoom,y:(e.clientY-r.top-view.y)/view.zoom};}
function screenPoint(e){const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
function hitUnit(pt){return units().filter(alive).map(u=>({u,d:Math.hypot(pt.x-u.x*W(),pt.y-u.y*H())})).filter(o=>o.d<Math.max(shape(o.u).front,shape(o.u).depth)*.8+18/view.zoom).sort((a,b)=>a.d-b.d)[0]?.u||null;}
function beginPivot(u,pt){const q=shape(u),cx=u.x*W(),cy=u.y*H(),dx=pt.x-cx,dy=pt.y-cy,c=Math.cos(u.facing),s=Math.sin(u.facing),lx=dx*c+dy*s,ly=-dx*s+dy*c,limit=18/view.zoom;const corner=Math.abs(Math.abs(lx)-q.depth/2)<limit&&Math.abs(Math.abs(ly)-q.front/2)<limit;if(!corner)return null;const sx=Math.sign(lx),sy=Math.sign(ly),anchorLocal={x:-sx*q.depth/2,y:-sy*q.front/2},anchor={x:cx+anchorLocal.x*c-anchorLocal.y*s,y:cy+anchorLocal.x*s+anchorLocal.y*c},actual={x:cx+sx*q.depth/2*c-sy*q.front/2*s,y:cy+sx*q.depth/2*s+sy*q.front/2*c};return {kind:"pivot",u,start:pt,origin:{x:u.x,y:u.y,facing:u.facing,used:u.moveUsed},anchor,startAngle:Math.atan2(actual.y-anchor.y,actual.x-anchor.x),anchorLocal,signX:sx,signY:sy,changed:false};}
function pointerDown(e){pointers.set(e.pointerId,screenPoint(e));if(pointers.size===2){const ps=[...pointers.values()],center={x:(ps[0].x+ps[1].x)/2,y:(ps[0].y+ps[1].y)/2};pinch={distance:Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y),zoom:view.zoom,center,anchor:{x:(center.x-view.x)/view.zoom,y:(center.y-view.y)/view.zoom}};drag=null;return;}const pt=pointerPoint(e),chosen=hitUnit(pt);if(chosen){const priorSelected=S.selected;if(S.mode==="shoot"||S.mode==="charge"){const target=chosen;if(target.side!=="player"&&priorSelected!==target.id){const attacker=S.units[priorSelected];if(S.mode==="shoot"&&attacker.kind==="archer")shoot(attacker,target,false);else if(S.mode==="charge")declareCharge(attacker,target);S.selected=attacker.id;S.mode=null;render();return;}}S.selected=chosen.id;if(S.phase==="movement"&&chosen.side==="player"&&!chosen.engaged&&!chosen.fled&&!chosen.shot&&chosen.moveUsed<chosen.stats.M&&(S.mode==="move"||!S.mode)){drag=beginPivot(chosen,pt)||{kind:"move",u:chosen,start:pt,origin:{x:chosen.x,y:chosen.y,facing:chosen.facing,used:chosen.moveUsed},changed:false};canvas.setPointerCapture(e.pointerId);e.preventDefault();render();return;}render();return;}if(S.mode==="shoot"||S.mode==="charge"){S.mode=null;render();return;}drag={kind:"pan",start:screenPoint(e),origin:{x:view.x,y:view.y}};canvas.setPointerCapture(e.pointerId);}
function pointerMove(e){if(pointers.has(e.pointerId))pointers.set(e.pointerId,screenPoint(e));if(pinch&&pointers.size>=2){const ps=[...pointers.values()],d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y),c={x:(ps[0].x+ps[1].x)/2,y:(ps[0].y+ps[1].y)/2},old=view.zoom;view.zoom=Math.max(.55,Math.min(2.7,pinch.zoom*d/Math.max(1,pinch.distance)));view.x=c.x-pinch.anchor.x*view.zoom;view.y=c.y-pinch.anchor.y*view.zoom;draw();return;}if(!drag)return;const pt=pointerPoint(e),u=drag.u;if(drag.kind==="pan"){const p=screenPoint(e);view.x=drag.origin.x+p.x-drag.start.x;view.y=drag.origin.y+p.y-drag.start.y;draw();return;}const scale=PX_PER_IN(),remaining=Math.max(0,u.stats.M-drag.origin.used);if(drag.kind==="move"){const dx=(pt.x-drag.start.x)/scale,dy=(pt.y-drag.start.y)/scale,along=dx*Math.cos(drag.origin.facing)+dy*Math.sin(drag.origin.facing),advance=Math.max(0,Math.min(remaining,along)),steps=Math.max(1,Math.ceil(advance/.1));let best=0;for(let i=1;i<=steps;i++){const n=advance*i/steps,x=drag.origin.x+Math.cos(drag.origin.facing)*n/BATTLEFIELD_WIDTH_IN,y=drag.origin.y+Math.sin(drag.origin.facing)*n/BATTLEFIELD_WIDTH_IN;if(!canPlace(u,x,y,drag.origin.facing))break;best=n;}u.x=drag.origin.x+Math.cos(drag.origin.facing)*best/BATTLEFIELD_WIDTH_IN;u.y=drag.origin.y+Math.sin(drag.origin.facing)*best/BATTLEFIELD_WIDTH_IN;u.facing=drag.origin.facing;u.moveUsed=drag.origin.used+best;drag.changed=best>0;u.moved=u.moved||best>0;}else if(drag.kind==="pivot"){const a=drag.anchor,angle=Math.atan2(pt.y-a.y,pt.x-a.x);let delta=angle-drag.startAngle;while(delta>Math.PI)delta-=Math.PI*2;while(delta< -Math.PI)delta+=Math.PI*2;const q=shape(u),maxAngle=remaining/Math.max(.01,q.front/scale);delta=Math.max(-maxAngle,Math.min(maxAngle,delta));const f=drag.origin.facing+delta,fx=Math.cos(f),fy=Math.sin(f),lx=-fy,ly=fx,sgx=drag.signX,sgy=drag.signY,x=(a.x-fx*q.depth/2*(-sgx)-lx*q.front/2*(-sgy)),y=(a.y-fy*q.depth/2*(-sgx)-ly*q.front/2*(-sgy));if(canPlace(u,x/W(),y/H(),f)){u.x=x/W();u.y=y/H();u.facing=
